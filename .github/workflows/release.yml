name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 仅在 Linux 下配置跨平台编译工具链与打包工具
      - name: Setup cross toolchain (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Install Linux packaging tools (cargo-deb & cargo-generate-rpm)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb, cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Linux 打包：输出 deb, rpm, 以及 portable tar.gz
      - name: Package Linux (deb, rpm, tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/quickhosts" target/release/quickhosts

          # 1. 生成 Debian 安装包 (.deb)
          cargo deb --no-build --target ${{ matrix.target }}
          find target -name "*.deb" -exec cp {} dist/ \;

          # 2. 生成 RPM 安装包 (.rpm)
          cargo generate-rpm --target ${{ matrix.target }} || cargo generate-rpm
          find target -name "*.rpm" -exec cp {} dist/ \;

          # 3. 生成便携压缩包 (.tar.gz)
          tar -czf "dist/quickhosts-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" quickhosts

      # macOS 打包：生成 .app bundle 并封装为拖拽安装的 .dmg 镜像
      - name: Package macOS (DMG)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          APP_NAME="QuickHosts"
          APP_DIR="${APP_NAME}.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          # 1. 复制可执行文件
          cp "target/${{ matrix.target }}/release/quickhosts" "${APP_DIR}/Contents/MacOS/quickhosts"
          chmod +x "${APP_DIR}/Contents/MacOS/quickhosts"

          # 2. 生成 Retina 高清 AppIcon.icns 图标
          mkdir -p AppIcon.iconset
          sips -z 16 16     icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o "${APP_DIR}/Contents/Resources/AppIcon.icns"
          rm -rf AppIcon.iconset

          # 3. 写入 Info.plist 元信息
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          cat <<EOF > "${APP_DIR}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>io.github.geekdex.quickhosts</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleExecutable</key>
              <string>quickhosts</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # 4. 代码自签名（Ad-hoc 签名以保证现代 macOS 正常执行）
          codesign --force --deep --sign - "${APP_DIR}"

          # 5. 构建支持直接拖拽至 Applications 的 DMG 磁盘映像
          DMG_STAGING="dmg_staging"
          mkdir -p "${DMG_STAGING}"
          cp -R "${APP_DIR}" "${DMG_STAGING}/"
          ln -s /Applications "${DMG_STAGING}/Applications"

          DMG_NAME="quickhosts-${{ github.ref_name }}-${{ matrix.target }}.dmg"
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "${DMG_STAGING}" \
            -ov -format UDZO \
            "dist/${DMG_NAME}"

          rm -rf "${DMG_STAGING}" "${APP_DIR}"

      # Windows 打包：纯净便携免安装版（提供独立 exe 与便携 zip）
      - name: Package Windows (Portable ZIP & EXE)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $bin = "target\${{ matrix.target }}\release\quickhosts.exe"
          $tag = "${{ github.ref_name }}"
          $target = "${{ matrix.target }}"

          # 1. 纯净独立 exe（点击即运行）
          Copy-Item $bin -Destination "dist\quickhosts-$tag-$target.exe"

          # 2. 便携压缩包 zip
          Compress-Archive -Path $bin -DestinationPath "dist\quickhosts-$tag-$target.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true

      - name: List artifacts to release
        run: ls -la dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
